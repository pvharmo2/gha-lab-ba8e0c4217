name: CodeQL scheduled
on:
  workflow_dispatch:
jobs:
  codeql:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: "main"
      - name: Initialize CodeQL With Dependencies
        uses: github/codeql-action/init@060c11b07f8397ef9df629bc80d83cac62808336 # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@060c11b07f8397ef9df629bc80d83cac62808336 # v3
